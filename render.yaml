services:
  - type: web
    name: ai-lead-discovery-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: LINKEDIN_ACTIVITY_PROVIDER
        value: serpapi
